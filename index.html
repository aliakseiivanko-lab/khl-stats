<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Статистика КХЛ</title>
<style>
:root{--bg:#f3f4f7;--c:#fff;--t:#14171c;--m:#6b7280;--b:#e5e7eb;--a:#c8102e;--a2:#fde8eb;--sh:0 1px 2px #0001,0 4px 14px #0000000d;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0d0f13;--c:#171a20;--t:#eceef2;--m:#8b93a1;--b:#262b34;--a:#ff4d62;--a2:#2a1519;--sh:none}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:820px;margin:0 auto;padding:0 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 0 6px}
h1{font-size:21px;margin:0;letter-spacing:-.3px}h1 a{color:inherit;text-decoration:none}
nav{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:8px 0;background:var(--bg);overflow-x:auto}
nav a{padding:8px 14px;border-radius:999px;color:var(--m);text-decoration:none;font-weight:600;white-space:nowrap}
nav a.on{background:var(--a);color:#fff}
h2{font-size:26px;margin:0;letter-spacing:-.5px}.hero{padding:10px 0 2px}
.m{color:var(--m);font-size:13px}.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button,select,input{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:10px;padding:8px 13px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--a)}button.on{background:var(--a);border-color:var(--a);color:#fff}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--b);padding:3px;border-radius:12px;margin:6px 6px 6px 0}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;color:var(--m);font-weight:600}
.seg button.on{background:var(--c);color:var(--t);box-shadow:var(--sh)}
input[type=search]{width:100%;margin:6px 0 10px;padding:11px 14px;cursor:text}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.grid button{padding:14px;font-weight:600;text-align:left;box-shadow:var(--sh)}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:4px 16px;overflow-x:auto;margin-top:12px;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td,th{padding:8px 6px;text-align:right;white-space:nowrap}
th{color:var(--m);font-size:12px;font-weight:600}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--c)}
tr+tr td{border-top:1px solid var(--b)}tr:hover td{background:var(--a2)}
tr.s td{color:var(--a);font-weight:700;font-size:11px;letter-spacing:.8px;text-transform:uppercase;padding-top:16px;border-top:0}tr.s:hover td{background:var(--c)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.pills span{background:var(--c);border:1px solid var(--b);border-radius:999px;padding:5px 12px;font-size:13px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi div{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:24px;letter-spacing:-.5px}.kpi span{color:var(--m);font-size:12px}
@media(max-width:520px){.kpi{grid-template-columns:repeat(2,1fr)}}
.g summary{display:flex;gap:8px;align-items:center;padding:10px 0;cursor:pointer;list-style:none}.g summary::-webkit-details-marker{display:none}.g .o{flex:1}.g+.g{border-top:1px solid var(--b)}.g table{margin-bottom:8px}
.d{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:3px;vertical-align:-1px}
.rk{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;font-size:12px;font-weight:700;margin-right:8px;color:var(--m);background:var(--b)}
.r1{background:#f5c542;color:#4a3800}.r2{background:#c9ced6;color:#333}.r3{background:#d99a6c;color:#3d2410}
.dh{font-weight:700;margin:18px 0 0;scroll-margin-top:60px}.dh::first-letter{text-transform:uppercase}.dh.tdy{color:var(--a)}
.up{display:flex;gap:8px;align-items:center;padding:10px 0;scroll-margin-top:60px}.up .o{flex:1}
.dt{color:var(--m);font-size:13px;min-width:74px}
.fx{display:flex;align-items:center;gap:8px;padding:10px 0}.fx+.fx{border-top:1px solid var(--b)}
.fx .h,.fx .a{flex:1;min-width:0;overflow-wrap:anywhere}.fx .h{text-align:right}
.fx .s{min-width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}.fx .s.u{color:var(--m);font-weight:600}
.fx .w{font-weight:700}.fx a{color:inherit;text-decoration:none}
.nx{background:var(--a2);border-radius:8px;padding-left:6px;padding-right:6px}
button[disabled]{opacity:.35;cursor:default}
</style></head><body><main>
<header><h1><a href="#">🏒 Статистика КХЛ</a></h1><div class="m" id="upd"></div></header>
<nav id="nav"><a data-v="list" href="#">Команды</a><a data-v="table" href="#view=table&conf=all">Таблица</a><a data-v="cal" href="#view=cal&st=all">Календарь</a><a data-v="league" href="#view=league&cat=pts&venue=all&win=s">Статистика лиги</a><a data-v="vs" href="#view=vs&a=&b=&venue=all&win=s">Сравнение</a></nav>
<div id="app">Загрузка…</div></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let M=[],T=[],PG=[],S=[];
const sum=a=>a.reduce((x,y)=>x+y,0),ok=(r,k)=>r.filter(x=>x[k]!=null);
const avg=(r,k)=>{const v=ok(r,k);return v.length?sum(v.map(x=>x[k]))/v.length:null};
const pair=(r,a,b)=>{const p=r.filter(x=>x[a]!=null&&x[b]!=null);return p.length?[sum(p.map(x=>x[a])),sum(p.map(x=>x[b]))]:null};
const ratio=(r,a,b)=>{const p=pair(r,a,b);return p&&p[1]?p[0]/p[1]:null};
const cov=(r,k)=>ok(r,k).length/r.length;
const f=(v,d=1)=>v==null?'–':v.toFixed(d),sg=v=>v==null?'–':(v>=0?'+':'')+v.toFixed(1);
const gp=p=>!p||!p[1]?'–':`${p[0]}/${p[1]}/${Math.round(100*p[0]/p[1])}%`;
const pk=p=>!p||!p[1]?'–':`${p[0]}/${p[1]}/${100-Math.round(100*p[0]/p[1])}%`;
const pct=p=>!p||!p[1]?null:100*p[0]/p[1],pkp=s=>{const p=pct(s.pk2);return p==null?null:100-p};
const df=(a,b)=>a==null||b==null?null:a-b,ad=(a,b)=>a==null||b==null?null:a+b;
function pov(m,t){const h=m.home===t,p=h?'home_':'away_',o=h?'away_':'home_',g=(s,k)=>m[s+k],gf=g(p,'goals'),ga=g(o,'goals');
return{home:h,date:m.date,ot:m.ot,so:m.so,gf,ga,gfg:gf-(m.so&&gf>ga?1:0),gag:ga-(m.so&&ga>gf?1:0),sf:g(p,'shots'),sa:g(o,'shots'),
ppg:g(p,'pp_goals'),ppo:g(p,'pp_opps'),ppga:g(o,'pp_goals'),ppoa:g(o,'pp_opps'),pim:g(p,'pim'),shg:g(p,'shg'),fo:g(p,'fo'),foa:g(o,'fo'),hit:g(p,'hits'),blk:g(p,'blocks')}}
const season=()=>M.reduce((s,m)=>m.season>s?m.season:s,'');
function sel(t,n,v,s){let ms=M.filter(m=>(m.home===t||m.away===t)&&(!s||m.season===s));
if(v==='home')ms=ms.filter(m=>m.home===t);if(v==='away')ms=ms.filter(m=>m.away===t);
ms.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);if(n)ms=ms.slice(-n);return ms.map(m=>pov(m,t))}
function calc(r){const n=r.length;if(!n)return null;const w=r.filter(x=>x.gf>x.ga).length,
pts=sum(r.map(x=>x.gf>x.ga?(x.ot?2:3):(x.ot?1:0))),sh=ratio(r,'gfg','sf'),sv=ratio(r,'gag','sa'),fo=pair(r,'fo','foa'),shg=ok(r,'shg');
return{gp:n,w,l:n-w,ot:r.filter(x=>x.ot).length,pts_pg:pts/n,gf:sum(r.map(x=>x.gfg))/n,ga:sum(r.map(x=>x.gag))/n,
sho:r.filter(x=>x.ga===0&&!x.so).length,sf:avg(r,'sf'),sa:avg(r,'sa'),sh:sh==null?null:100*sh,sv:sv==null?null:100*(1-sv),
pp2:pair(r,'ppg','ppo'),pk2:pair(r,'ppga','ppoa'),shgS:shg.length?sum(shg.map(x=>x.shg)):null,pim:avg(r,'pim'),
fo_pct:!fo||!(fo[0]+fo[1])?null:100*fo[0]/(fo[0]+fo[1]),blk:avg(r,'blk'),hit:avg(r,'hit'),
ppgS:sum(ok(r,'ppg').map(x=>x.ppg)),ppgaS:sum(ok(r,'ppga').map(x=>x.ppga)),
c_pim:cov(r,'pim'),c_ppo:cov(r,'ppo'),c_shg:cov(r,'shg'),c_fo:cov(r,'fo'),c_blk:cov(r,'blk'),c_hit:cov(r,'hit')}}
const need=(k,fn,n=.6)=>s=>s[k]>=n?fn(s):'–';
const SECT=[['Результаты',[['Матчей',s=>s.gp],['Победы-пораж.',s=>s.w+'-'+s.l],['Очки за матч',s=>f(s.pts_pg,2)],['Матчей в ОТ/Б',s=>s.ot]]],
['Голы',[['Забито за матч',s=>f(s.gf)],['Пропущено за матч',s=>f(s.ga)],['Сухих матчей',s=>s.sho]]],
['Спецбригады',[['Голы в больш.',need('c_pim',s=>s.ppgS)],['Пропущено в меньш.',need('c_pim',s=>s.ppgaS)],
['Большинство',need('c_ppo',s=>gp(s.pp2),.2)],['Меньшинство',need('c_ppo',s=>pk(s.pk2),.2)],
['Забито в меньш.',need('c_shg',s=>s.shgS==null?'–':s.shgS)],['Штраф, мин/матч',need('c_pim',s=>f(s.pim))]]],
['Игра',[['Вбрасывания, %',need('c_fo',s=>f(s.fo_pct,0))],['Блок. броски/матч',need('c_blk',s=>f(s.blk))],['Силовые/матч',need('c_hit',s=>f(s.hit))]]],
['Броски',[['Броски/матч',s=>f(s.sf)],['Броски пр./матч',s=>f(s.sa)],['Реализация, %',s=>f(s.sh)],['Сейвы, %',s=>f(s.sv)]]]];
function table(cols){let h='<table>';if(cols.length>1)h+='<tr><th></th>'+cols.map(c=>`<th>${esc(c[0])}</th>`).join('')+'</tr>';
for(const[t,rows]of SECT){let b='';for(const[l,fn]of rows){const c=cols.map(x=>x[1]?String(fn(x[1])):'–');
if(c.every(x=>x==='–'))continue;b+=`<tr><td>${l}</td>`+c.map(x=>`<td>${x}</td>`).join('')+'</tr>'}
if(b)h+=`<tr class="s"><td colspan="${cols.length+1}">${t}</td></tr>`+b}return h+'</table>'}
const dot=x=>`<span class="d" style="background:${x.gf>x.ga?'#22a559':x.ot?'#f08a24':'#e5484d'}"></span>`;
const form=r=>r.slice(-5).map(dot).join('')||'–';
const plural=(n,w)=>{const a=n%10,b=n%100;return a===1&&b!==11?w[0]:a>=2&&a<=4&&!(b>=12&&b<=14)?w[1]:w[2]};
function streak(r){if(!r.length)return'–';const win=r.at(-1).gf>r.at(-1).ga;let c=0;
for(let i=r.length-1;i>=0&&(r[i].gf>r[i].ga)===win;i--)c++;
return c+' '+(win?plural(c,['победа','победы','побед']):plural(c,['поражение','поражения','поражений']))+(c>1?' подряд':'')}
const LEG='<p class="m">Большинство: голы / большинств / %. Меньшинство: пропущено / меньшинств / % отыграно.<br>🟢 победа · 🟠 проигрыш в ОТ/буллитах · 🔴 проигрыш</p>';
const VT={all:'все матчи',home:'домашние матчи',away:'гостевые матчи'};

const CATS=[
['pts','Очки','Очки за матч',[['И',s=>s.gp],['В-П',s=>s.w+'-'+s.l],['О/м',s=>f(s.pts_pg,2)]],s=>s.pts_pg,1],
['gls','Голы','Голы за матч',[['ЗБ/м',s=>f(s.gf)],['ПР/м',s=>f(s.ga)],['±/м',s=>sg(s.gf-s.ga)]],s=>s.gf-s.ga,1],
['pp','Большинство','Большинство (голы / большинств / %)',[['Г/Б',s=>s.pp2&&s.pp2[1]?s.pp2.join('/'):'–'],['%',s=>f(pct(s.pp2))]],s=>pct(s.pp2),1],
['pk','Меньшинство','Меньшинство (пропущено / меньшинств / % отыграно)',[['Пр/М',s=>s.pk2&&s.pk2[1]?s.pk2.join('/'):'–'],['%',s=>f(pkp(s))]],pkp,1],
['pim','Штраф','Штрафные минуты за матч (меньше — выше)',[['И',s=>s.gp],['Мин/м',s=>f(s.pim)]],s=>s.pim,0],
['fo','Вбрасывания','Выигранные вбрасывания, %',[['И',s=>s.gp],['Вбр%',s=>f(s.fo_pct)]],s=>s.fo_pct,1],
['sh','Броски','Броски в створ за матч',[['Бр/м',s=>f(s.sf)],['Бр.пр',s=>f(s.sa)],['Разн',s=>sg(df(s.sf,s.sa))]],s=>df(s.sf,s.sa),1],
['eff','Реализация','Реализация и сейвы, % (PDO = сумма)',[['Реал',s=>f(s.sh)],['Сейв',s=>f(s.sv)],['PDO',s=>f(ad(s.sh,s.sv))]],s=>ad(s.sh,s.sv),1],
['blk','Блоки','Блокированные броски за матч',[['И',s=>s.gp],['Бл/м',s=>f(s.blk)]],s=>s.blk,1],
['hit','Силовые','Силовые приёмы за матч',[['И',s=>s.gp],['Сил/м',s=>f(s.hit)]],s=>s.hit,1]];

const P=()=>Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const WIN=[['5','5 игр'],['10','10 игр'],['20','20 игр'],['s','Сезон']],VEN=[['all','Все'],['home','Дома'],['away','На выезде']];
const go=(o,cur=P())=>`data-go="${esc(new URLSearchParams({...cur,...o}).toString())}"`;
const chips=(list,cur,key,p)=>`<div class="seg">${list.map(([k,l])=>`<button class="${cur===k?'on':''}" ${go({[key]:k},p)}>${l}</button>`).join('')}</div>`;
const nWin=w=>w==='s'||!w?null:+w,per=w=>nWin(w)?`последние ${w} матчей`:'весь сезон';

function vTeam(p){const t=p.t,s=season(),v=p.venue||'all',w=p.win||'s';
if(!T.includes(t))return vList();
let h=`<div class="hero"><h2>${esc(t)}</h2><div class="m">Сезон ${s}</div></div>`,body;
const all=sel(t,null,'all',s),ex=[['team',null,'Отчёт'],['cmp',null,'⚖️ Дом vs выезд'],['last',null,'🕐 Последняя игра']];
const mode=p.tab==='roster'||p.tab==='games'?p.tab:v==='cmp'||v==='last'?v:'team';
h+=`<div class="row">${[['team','Отчёт'],['games','📅 Календарь'],['roster','👥 Состав'],['cmp','⚖️ Дом vs выезд'],['last','🕐 Последняя игра']].map(([k,l])=>
`<button class="${mode===k?'on':''}" ${go({tab:k==='roster'||k==='games'?k:'',venue:k==='team'||k==='roster'||k==='games'?'all':k,win:'s'},p)}>${l}</button>`).join('')}
<button data-go="view=vs&a=${encodeURIComponent(t)}&b=&venue=all&win=s">⚔️ Сравнить с…</button></div>`;
if(mode==='team'){const r=sel(t,nWin(w),v,s);
h+=chips(WIN,w,'win',p)+chips(VEN,v,'venue',p)+`<div class="m">${VT[v]} · ${per(w)}</div>`;
if(!r.length)return h+'<p>Матчей по этому фильтру пока нет.</p>';
const a=sel(t,null,v,s);h+=`<div class="pills"><span>Форма ${form(a)}</span><span>Серия: ${streak(a)}</span></div>${kpi(calc(r))}<div class="card">${table([['',calc(r)]])}</div>`+LEG+note(r)}
else if(mode==='cmp'){const H=sel(t,null,'home',s),A=sel(t,null,'away',s);
h+=`<p>Форма дома: ${form(H)}<br>Форма на выезде: ${form(A)}</p><div class="card">${table([['Дома',calc(H)],['Выезд',calc(A)]])}</div>`+LEG+note(H.concat(A))}
else if(mode==='last')h+=vLast(t,s);
else if(mode==='games')h+=vGames(t,s,v,p);
else h+=chips(WIN,w,'win',p)+chips(VEN,v,'venue',p)+`<div class="m">${VT[v]} · ${per(w)}</div>`+roster(t,s,v,w,p);
return h}
const kpi=s=>`<div class="kpi">${[['Очки за матч',f(s.pts_pg,2)],['Победы–пораж.',s.w+'–'+s.l],['Забито за матч',f(s.gf)],['Пропущено за матч',f(s.ga)]].map(([l,v])=>`<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
const mmss=x=>x==null?'–':Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0'),sgn=v=>v>0?'+'+v:v;
const seasonOf=d=>{const y=+d.slice(0,4),st=+d.slice(5,7)>=7?y:y-1;return st+'/'+String((st+1)%100).padStart(2,'0')};
const SKC=[['gp','И',s=>s.gp],['g','Ш',s=>s.g],['a','А',s=>s.a],['pts','О',s=>s.g+s.a],['pm','+/-',s=>s.pm,sgn],['pim','Штр',s=>s.pim],
['sog','Бр',s=>s.bs],['blk','Бл',s=>s.blk],['hit','Сил',s=>s.hit],['fo','Вбр%',s=>s.fo>=10?100*s.fow/s.fo:null,v=>v.toFixed(0)],['toi','Время',s=>s.toi/s.gp,mmss]];
function roster(t,s,v,w,p){
let gs=PG.filter(x=>(x.h===t||x.a===t)&&seasonOf(x.d)===s&&(v==='all'||(v==='home'?x.h===t:x.a===t)));
gs.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.id-b.id);const n=nWin(w);if(n)gs=gs.slice(-n);
if(!gs.length)return'<p class="m">Данных по составам пока нет: они появятся после следующего обновления.</p>';
const A=new Map();
for(const x of gs){const sd=x.h===t?0:1;for(const r of x.p){if(r[0]!==sd)continue;const k=r[2];
let o=A.get(k);if(!o)A.set(k,o={n:r[1],name:k,pos:r[3],gp:0,toi:0,g:0,a:0,pm:0,pim:0,bs:0,blk:0,hit:0,fo:0,fow:0,ga:0,sa:0});
o.gp++;o.n=r[1];o.toi+=r[4];if(r[3]==='в'){o.ga+=r[20]||0;o.sa+=r[21]||0;continue}
o.g+=r[6];o.a+=r[7];o.pm+=r[8];o.pim+=r[10];o.bs+=r[12];o.blk+=r[14];o.hit+=r[15];o.fo+=r[18];o.fow+=r[19]}}
const all=[...A.values()],sk=all.filter(o=>o.pos!=='в'),gk=all.filter(o=>o.pos==='в').sort((a,b)=>b.toi-a.toi);
const key=p.sort||'pts',asc=p.dir==='asc',col=SKC.find(c=>c[0]===key)||(key==='name'?['name']:SKC[3]),val=o=>col[2](o);
sk.sort((a,b)=>{if(col[0]==='name')return asc?a.name.localeCompare(b.name,'ru'):b.name.localeCompare(a.name,'ru');const x=val(a),y=val(b);return x==null?1:y==null?-1:(asc?x-y:y-x)||b.g-a.g});
const nm=o=>`<span class="rk">${o.n}</span>${esc(o.name)}`;
let h=`<div class="card"><table><tr><th style="cursor:pointer" ${go({sort:'name',dir:key==='name'&&asc?'desc':'asc'},p)}>Полевые · ${gs.length} игр${key==='name'?(asc?' ▴':' ▾'):''}</th><th>Поз</th>${SKC.map(c=>`<th style="cursor:pointer;${c[0]===col[0]?'color:var(--a)':''}" ${go({sort:c[0],dir:c[0]===col[0]&&!asc?'asc':'desc'},p)}>${c[1]}${c[0]===col[0]?(asc?' ▴':' ▾'):''}</th>`).join('')}</tr>`+
sk.map(o=>`<tr><td>${nm(o)}</td><td>${o.pos==='з'?'З':'Н'}</td>${SKC.map(c=>{const x=c[2](o);return`<td>${x==null?'–':c[3]?c[3](x):x}</td>`}).join('')}</tr>`).join('')+'</table></div>';
if(gk.length)h+=`<div class="card"><table><tr><th>Вратари</th><th>И</th><th>Время</th><th>ПШ</th><th>Бр</th><th>Сейвы%</th><th>КН</th></tr>`+
gk.map(o=>`<tr><td>${nm(o)}</td><td>${o.gp}</td><td>${mmss(o.toi)}</td><td>${o.ga}</td><td>${o.sa}</td><td>${o.sa?(100*(1-o.ga/o.sa)).toFixed(1):'–'}</td><td>${o.toi?(o.ga*3600/o.toi).toFixed(2):'–'}</td></tr>`).join('')+'</table></div>';
return h+'<p class="m">Нажми на заголовок колонки, чтобы отсортировать; повторное нажатие меняет направление (▾ по убыванию, ▴ по возрастанию). Ш — голы, А — передачи, О — очки, Бр — броски в створ, Бл — блок-шоты, Сил — силовые, Вр — среднее время за матч. +/- не учитывает голы в большинстве. За период берутся последние матчи команды.</p>'}
const note=r=>{const n=r.filter(x=>x.ppo!=null).length;return r.length&&n<r.length?`<p class="m">ℹ️ Число большинств есть не для всех матчей (${n} из ${r.length}).</p>`:''};
function gDetail(m,t){const o=m.home===t?m.away:m.home,me=pov(m,t),op=pov(m,o),n=x=>x==null?'–':x,pr=(g,k)=>g==null||k==null?'–':g+'/'+k,
fo=r=>r.fo==null||r.foa==null||!(r.fo+r.foa)?'–':`${r.fo} (${Math.round(100*r.fo/(r.fo+r.foa))}%)`;
const R=[['Броски',r=>n(r.sf)],['Большинство',r=>pr(r.ppg,r.ppo)],['Штраф, мин',r=>n(r.pim)],['Забито в меньш.',r=>n(r.shg)],['Вбрасывания',fo],['Блок. броски',r=>n(r.blk)],['Силовые',r=>n(r.hit)]]
.map(([l,fn])=>[l,fn(me),fn(op)]).filter(x=>x[1]!=='–'||x[2]!=='–');
return R.length?`<table><tr><th></th><th>Свои</th><th>Соперн.</th></tr>${R.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</table>`:'<p class="m">Подробной статистики пока нет.</p>'}
const todayS=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dObj=d=>new Date(d+'T00:00:00'),WD=d=>dObj(d).toLocaleDateString('ru-RU',{weekday:'short'}),dm=d=>d.slice(8)+'.'+d.slice(5,7);
const MON=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const ST=[['all','Весь календарь'],['up','Предстоящие'],['done','Сыграно']];
const res=m=>m.home_goals+':'+m.away_goals+(m.so?' (Б)':m.ot?' (ОТ)':'');
// единый список: сыгранные матчи (протоколы) + будущие из schedule.json; время берём из расписания, если оно там есть
function fixtures(){const s=season(),map=new Map(),hist=new Map();
for(const m of M){if(m.season!==s)continue;map.set(m.date+'|'+m.home+'|'+m.away,{d:m.date,h:m.home,a:m.away,m});
const k=m.home+'|'+m.away;if(!hist.has(k))hist.set(k,[]);hist.get(k).push(m.date)}
const near=(k,d)=>(hist.get(k)||[]).some(x=>Math.abs(dObj(x)-dObj(d))<=2*864e5);
for(const g of S){const k=g.d+'|'+g.h+'|'+g.a,f=map.get(k);if(f){f.t=g.t;continue}
if(seasonOf(g.d)!==s||near(g.h+'|'+g.a,g.d))continue;map.set(k,{d:g.d,h:g.h,a:g.a,t:g.t})}
return[...map.values()].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.t||'')<(b.t||'')?-1:(a.t||'')>(b.t||'')?1:0)}
const noSched=()=>S.length?'':'<p class="m">ℹ️ Расписание будущих матчей пока не загружено — оно появится после ближайшего обновления данных. Пока показаны только сыгранные игры.</p>';
function vGames(t,s,v,p){const st=p.st||'all',td=todayS();
const fx=fixtures().filter(f=>(f.h===t||f.a===t)&&seasonOf(f.d)===s&&(v==='all'||(v==='home'?f.h===t:f.a===t)));
const done=fx.filter(f=>f.m),up=fx.filter(f=>!f.m),nx=up.find(f=>f.d>=td)||up[0];
const list=st==='up'?up:st==='done'?done.slice().reverse():fx;
let h=chips(ST,st,'st',p)+chips(VEN,v,'venue',p);
if(!fx.length)return h+'<p>Матчей по этому фильтру нет.</p>'+noSched();
const opp=f=>f.h===t?f.a:f.h,vs=f=>f.h===t?'vs':'@';
h+=`<div class="pills"><span>Сыграно ${done.length}</span><span>Впереди ${up.length}</span>${nx?`<span>Следующий матч: ${dm(nx.d)} ${vs(nx)} ${esc(opp(nx))}${nx.t?' · '+nx.t+' МСК':''}</span>`:''}</div>`;
if(!list.length)return h+'<p>Матчей по этому фильтру нет.</p>'+noSched();
h+=`<div class="card">`+list.map(f=>{const dd=`<span class="dt">${dm(f.d)} ${WD(f.d)}</span>`;
if(f.m){const me=pov(f.m,t);return `<details class="g">`+`<summary>${dot(me)}${dd}<span class="o">${vs(f)} ${esc(opp(f))}</span><b>${res(f.m)}</b></summary>${gDetail(f.m,t)}</details>`}
const late=f.d<td;
return `<div class="g"><div class="up${f===nx?' nx':''}"${f===nx?' id="next"':''}><span class="d" style="background:var(--b)"></span>${dd}<span class="o">${vs(f)} ${esc(opp(f))}</span><span class="m">${late?'результат уточняется':(f.t?f.t+' МСК':'время уточняется')}</span></div></div>`}).join('')+'</div>'
+'<p class="m">Время начала — московское (МСК). Нажми на сыгранный матч, чтобы раскрыть статистику.</p>'+noSched();return h}
function vCal(p){const all=fixtures(),td=todayS(),st=p.st||'all',tm=T.includes(p.tm)?p.tm:'';
const months=[...new Set(all.map(f=>f.d.slice(0,7)))];
if(!months.length)return'<h2>Календарь лиги</h2><p class="m">Матчей пока нет.</p>'+noSched();
const cm=td.slice(0,7),mo=months.includes(p.mo)?p.mo:months.includes(cm)?cm:(months.filter(x=>x<=cm).pop()||months[0]),i=months.indexOf(mo);
const fx=all.filter(f=>f.d.slice(0,7)===mo&&(!tm||f.h===tm||f.a===tm)&&(st==='all'||(st==='up'?!f.m:!!f.m)));
const nd=all.filter(f=>f.d.slice(0,7)===mo&&f.m).length;
let h=`<h2>Календарь лиги</h2><div class="m">Сезон ${season()} · всего матчей в календаре: ${all.length}</div>`+
`<div class="row" style="align-items:center"><button ${i>0?go({mo:months[i-1]},p):'disabled'}>‹</button><b style="min-width:150px;text-align:center">${MON[+mo.slice(5)-1]} ${mo.slice(0,4)}</b>`+
`<button ${i<months.length-1?go({mo:months[i+1]},p):'disabled'}>›</button>${mo!==cm&&months.includes(cm)?`<button ${go({mo:cm},p)}>Сегодня</button>`:''}</div>`+
chips(ST,st,'st',p)+`<div class="row"><select data-sel="tm"><option value="">Все команды</option>${T.map(x=>`<option ${x===tm?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
if(!fx.length)return h+'<p>Матчей по этому фильтру нет.</p>'+noSched();
const days=[...new Set(fx.map(f=>f.d))],first=mo===cm?days.find(d=>d>=td):null;
const tl=x=>`<a href="#" ${go({view:'team',t:x,venue:'all',win:'s',tab:'',st:'',mo:'',tm:''},{})}>${esc(x)}</a>`;
h+=`<div class="m">${fx.length} ${plural(fx.length,['матч','матча','матчей'])} · в месяце сыграно ${nd} из ${all.filter(f=>f.d.slice(0,7)===mo).length}</div>`;
h+=days.map(d=>`<div class="dh${d===td?' tdy':''}"${d===first?' id="next"':''}>${dObj(d).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}${d===td?' · сегодня':''}</div><div class="card" style="margin-top:6px">`+
fx.filter(f=>f.d===d).map(f=>{const m=f.m,hw=m&&m.home_goals>m.away_goals,aw=m&&m.away_goals>m.home_goals;
return `<div class="fx"><span class="h${hw?' w':''}">${tl(f.h)}</span><span class="s${m?'':' u'}">${m?res(m):(f.t||'–:–')}</span><span class="a${aw?' w':''}">${tl(f.a)}</span></div>`}).join('')+'</div>').join('');
return h+'<p class="m">У будущих матчей в центре — время начала (МСК), у сыгранных — счёт. Жирным выделен победитель.</p>'+noSched()}
function vLast(t,s){const ms=M.filter(m=>(m.home===t||m.away===t)&&m.season===s).sort((a,b)=>a.date<b.date?-1:1),m=ms.at(-1);
if(!m)return'<p>Матчей пока нет.</p>';const o=m.home===t?m.away:m.home,me=pov(m,t),op=pov(m,o),d=m.date.split('-').reverse().join('.');
const res=me.gf>me.ot*0+me.ga?'🟢 Победа'+(m.so?' по буллитам':m.ot?' в ОТ':''):m.ot?'🟠 Поражение'+(m.so?' по буллитам':' в ОТ'):'🔴 Поражение';
const n=x=>x==null?'–':x,pr=(g,k)=>g==null||k==null?'–':g+'/'+k,fo=r=>r.fo==null||r.foa==null||!(r.fo+r.foa)?'–':`${r.fo} (${Math.round(100*r.fo/(r.fo+r.foa))}%)`;
const R=[['Броски',r=>n(r.sf)],['Большинство',r=>pr(r.ppg,r.ppo)],['Штраф, мин',r=>n(r.pim)],['Забито в меньш.',r=>n(r.shg)],['Вбрасывания',fo],['Блок. броски',r=>n(r.blk)],['Силовые',r=>n(r.hit)]]
.map(([l,fn])=>[l,fn(me),fn(op)]).filter(x=>x[1]!=='–'||x[2]!=='–');
return `<div class="m">последняя игра · ${d}</div><h2>${esc(m.home)} ${m.home_goals}:${m.away_goals} ${esc(m.away)}${m.so?' (Б)':m.ot?' (ОТ)':''}</h2><p>${res} · ${me.home?'дома':'на выезде'}</p>`+
(R.length?`<div class="card"><table><tr><th></th><th>Свои</th><th>Соперн.</th></tr>${R.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</table></div>`:'<p class="m">Подробной статистики пока нет.</p>')}

function vLeague(p){const cat=CATS.find(c=>c[0]===p.cat)||CATS[0],v=p.venue||'all',w=p.win||'s',s=season();
const cf=['w','e'].includes(p.conf)?p.conf:'all',data=T.filter(t=>cf==='all'||confOf(t)===cf).map(t=>[t,calc(sel(t,nWin(w),v,s))]).filter(x=>x[1]);
const dir=p.dir||(cat[5]?'desc':'asc');
data.sort((a,b)=>{const x=cat[4](a[1]),y=cat[4](b[1]);return x==null?1:y==null?-1:dir==='asc'?x-y:y-x});
return `<h2>Лига · ${cat[2]}</h2><div class="m">${{all:'вся лига',w:'Запад',e:'Восток'}[cf]} · ${VT[v]} · ${per(w)} · Сезон ${s}</div>`+chips([['all','Вся лига'],['w','Запад'],['e','Восток']],cf,'conf',p)+chips(WIN,w,'win',p)+chips(VEN,v,'venue',p)+
chips(CATS.map(c=>[c[0],c[1]]),cat[0],'cat',{...p,dir:''})+chips([['desc','↓ По убыванию'],['asc','↑ По возрастанию']],dir,'dir',p)+`<div class="card"><table><tr><th>#  Команда</th>${cat[3].map(c=>`<th>${c[0]}</th>`).join('')}</tr>`+
data.map(([t,x],i)=>`<tr><td><span class="rk r${i<3?i+1:0}">${i+1}</span><a href="#" style="color:inherit" ${go({view:'team',t,venue:'all',win:'s'},{})}>${esc(t)}</a></td>${cat[3].map(c=>`<td>${c[1](x)}</td>`).join('')}</tr>`).join('')+'</table></div>'}

function vVs(p){const a=p.a,b=p.b,s=season(),v=p.venue||'all',w=p.win||'s';
const selb=(k,cur)=>`<select data-sel="${k}"><option value="">— команда —</option>${T.map(t=>`<option ${t===cur?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
let h=`<h2>Сравнение команд</h2><div class="row">${selb('a',a)} vs ${selb('b',b)}${a&&b?`<button ${go({a:b,b:a},p)}>🔄</button>`:''}</div>`;
if(!T.includes(a)||!T.includes(b)||a===b)return h+'<p class="m">Выбери две разные команды.</p>';
const ha=v==='ha',ra=sel(a,nWin(w),ha?'home':'all',s),rb=sel(b,nWin(w),ha?'away':'all',s);
h+=chips(WIN,w,'win',p)+chips([['all','Все матчи'],['ha','1-я дома · 2-я в гостях']],v,'venue',p)+`<div class="m">${per(w)} · Сезон ${s}</div><p>Форма ${esc(a)}: ${form(ra)}<br>Форма ${esc(b)}: ${form(rb)}</p>`;
return !ra.length||!rb.length?h+'<p>У одной из команд нет матчей по этому фильтру.</p>':h+`<div class="card">${table([[a,calc(ra)],[b,calc(rb)]])}</div>`+LEG}

const EAST=['авангард','ак барс','автомобилист','металлург','трактор','салават','сибирь','барыс','амур','адмирал','нефтехим'];
const confOf=t=>EAST.some(k=>t.toLowerCase().startsWith(k))?'e':'w';
function standings(ts,s){return ts.map(t=>{const o={t,gp:0,w:0,wo:0,lo:0,l:0,gf:0,ga:0,pts:0};
for(const x of sel(t,null,'all',s)){o.gp++;o.gf+=x.gfg;o.ga+=x.gag;
if(x.gf>x.ga){if(x.ot){o.wo++;o.pts+=2}else{o.w++;o.pts+=3}}else if(x.ot){o.lo++;o.pts++}else o.l++}return o})
.sort((a,b)=>b.pts-a.pts||b.w-a.w||(b.w+b.wo)-(a.w+a.wo)||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
function vTable(p){const c=p.conf||'all',s=season(),ts=c==='all'?T:T.filter(t=>confOf(t)===c),rows=standings(ts,s),
name={all:'Общая таблица',w:'Западная конференция',e:'Восточная конференция'}[c]||'Общая таблица';
return `<h2>${name}</h2><div class="m">Сезон ${s} · ${rows.length} команд</div>`+chips([['all','Общая'],['w','Запад'],['e','Восток']],c,'conf',p)+
`<div class="card"><table><tr><th>Команда</th><th>И</th><th>В</th><th>ВО</th><th>ПО</th><th>П</th><th>Ш</th><th>РШ</th><th>О</th></tr>`+
rows.map((o,i)=>`<tr><td><span class="rk r${i<3?i+1:0}">${i+1}</span><a href="#" style="color:inherit" ${go({view:'team',t:o.t,venue:'all',win:'s'},{})}>${esc(o.t)}</a></td><td>${o.gp}</td><td>${o.w}</td><td>${o.wo}</td><td>${o.lo}</td><td>${o.l}</td><td>${o.gf}-${o.ga}</td><td>${sgn(o.gf-o.ga)}</td><td><b>${o.pts}</b></td></tr>`).join('')+'</table></div>'+
'<p class="m">В — победы в основное время, ВО — победы в ОТ или по буллитам, ПО — поражения в ОТ или по буллитам, П — поражения в основное время. Ш — забитые и пропущенные (без победного буллита), РШ — разница. Места: очки, затем победы в основное время, все победы, разница шайб, забитые.</p>'}
function vList(){return `<div class="row"><button ${go({view:'table',conf:'all'},{})}>🏆 Турнирная таблица</button><button ${go({view:'cal',st:'all'},{})}>📅 Календарь лиги</button><button ${go({view:'league',cat:'pts',venue:'all',win:'s'},{})}>📊 Статистика лиги</button><button data-go="view=vs&a=&b=&venue=all&win=s">⚔️ Сравнить две команды</button></div>
<input id="q" type="search" placeholder="Найти команду…"><div class="grid" id="tg">${T.map(t=>`<button ${go({view:'team',t,venue:'all',win:'s'},{})}>${esc(t)}</button>`).join('')}</div>`}

function render(){const p=P(),el=$('#app'),nv=['league','vs','table','cal'].includes(p.view)?p.view:'list';
document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===nv));
if(!M.length){el.innerHTML='<p>Данных пока нет — дождись первого запуска обновления (см. README).</p>';return}
el.innerHTML=p.view==='team'?vTeam(p):p.view==='league'?vLeague(p):p.view==='table'?vTable(p):p.view==='vs'?vVs(p):p.view==='cal'?vCal(p):vList();
if(p.view==='cal'||(p.view==='team'&&p.tab==='games'))if((p.st||'all')==='all'){const n=document.getElementById('next');if(n)n.scrollIntoView({block:'center'})}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;e.preventDefault();
const q=new URLSearchParams(b.dataset.go),cur=P(),n={};
// view сохраняется из текущей страницы, если кнопка его не задаёт
if(!q.has('view'))n.view=cur.view;for(const[k,v]of q)n[k]=v;
if(!q.has('view')&&cur.view==='team'&&!q.has('t'))n.t=cur.t;
location.hash=new URLSearchParams({...cur,...n}).toString()});
document.addEventListener('change',e=>{const s=e.target.closest('[data-sel]');if(!s)return;const p=P();p[s.dataset.sel]=s.value;location.hash=new URLSearchParams(p).toString()});
document.addEventListener('input',e=>{if(e.target.id!=='q')return;const v=e.target.value.toLowerCase();document.querySelectorAll('#tg button').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(v))});
addEventListener('hashchange',render);
fetch('data/matches.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{M=d.matches;T=[...new Set(M.flatMap(m=>[m.home,m.away]))].sort();
fetch('data/schedule.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(x=>{if(x){S=x.games||[];render()}}).catch(()=>{});
if(d.updated)$('#upd').textContent='Обновлено: '+new Date(d.updated).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'});render();return fetch('data/players.json').then(r=>r.json()).then(d=>{PG=d.games||[];render()}).catch(()=>{})})
.catch(()=>$('#app').textContent='Не удалось загрузить data/matches.json (локально открывай через: python -m http.server)');
</script></body></html>
