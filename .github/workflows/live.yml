name: live
on:
  schedule:
    - cron: "*/10 6-20 * * *"        # 09:00–23:59 по Москве: проверка, не пора ли включать лайв
  workflow_dispatch:
concurrency:
  group: live
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pypdf
      - name: Живая статистика
        run: python scripts/live.py
        env:
          KHL_SEASON_ID: "1436"
          KHL_FIRST_ID: "901978"
          PDF_DIR: data
          KHL_COOKIE: ${{ secrets.KHL_COOKIE }}
