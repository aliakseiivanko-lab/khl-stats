name: update-and-deploy
on:
  schedule:
    - cron: "7 14 * * *"   # 17:07 МСК
    - cron: "7 20 * * *"   # 23:07 МСК
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pypdf
      - name: Скачать и разобрать протоколы
        timeout-minutes: 35
        run: python scripts/update_data.py
        env:
          KHL_SEASON_ID: "1436"
          KHL_FIRST_ID: "901978"
          KHL_LAST_ID: "904000"
          KHL_LOOKAHEAD: "120"
          KHL_MISS_RETRY_H: "1"
          KHL_EXTRA_IDS: ""
          PDF_DIR: data
          KHL_COOKIE: ${{ secrets.KHL_COOKIE }}
      - name: Сохранить данные в репозиторий
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A data site/data
          git diff --cached --quiet || (git commit -m "data: update" && git pull --rebase && git push)
      - if: always()
        uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        if: always()
        uses: actions/deploy-pages@v4
